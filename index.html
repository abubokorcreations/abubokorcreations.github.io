async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function login() {

  else { const h = await sha(CONFIG.salt + p), m = (settings.mods || []).find(x => x.h === h); if (m) { sessionStorage.setItem('adm', 'mod:' + m.name); document.body.classList.add('mod'); toast('মডারেটর: ' + m.name); } else toast('পাসওয়ার্ড ভুল'); }
}

function shrink(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 700 / im.width), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8));
    }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

async function saveForm(id) {
  const f = $('f_file').files[0];
  const img = f ? await shrink(f) : ($('f_img').value.trim() || (products.find(x => x.id === id) || {}).image || '');
  const d = {
    sourceLink: $('f_link').value.trim(), title: $('f_title').value.trim() || 'নতুন পণ্য', image: img,
    price: +$('f_price').value || 0, oldPrice: +$('f_old').value || 0,
    category: $('f_cat').value.trim(), cost: +$('f_cost').value || 0, featured: $('f_feat').checked, video: $('f_video').value.trim(), variants: $('f_vars').value.trim(), saleEnd: $('f_sale').value || '', stock: $('f_stock').value === '' ? null : +$('f_stock').value, desc: $('f_desc').value.trim()
  };
  const xf = [...$('f_files').files].slice(0, 5); if (xf.length) d.images = await Promise.all(xf.map(x => shrink(x)));
  if (id) Object.assign(products.find(x => x.id === id), d);
  else products.push({ id: Date.now(), ...d });
  save(); closeM('formM'); render(); toast('সেভ হয়েছে');

async function ghPut(path, content, msg, tok) {

    if (w.status === 409 || w.status === 422) { await new Promise(ok => setTimeout(ok, 1500 * (i + 1))); continue; }
    if (w.status === 401 || w.status === 403 || w.status === 404) throw new Error('টোকেন ভুল বা অনুমতি নেই');
    throw new Error('GitHub ' + w.status);

}

}
function saleForm() {
  $('formB').innerHTML = `<h3>নতুন বিক্রি</h3><label>পণ্য</label><select id="s_p" onchange="$('s_pr').value=(products.find(x=>x.id==this.value)||{}).price||''">${products.map(p => `<option value="${p.id}">${esc(p.title)}${p.stock != null ? ' (স্টক ' + p.stock + ')' : ''}</option>`).join('')}</select>
    <label>কাস্টমারের ফোন (ঐচ্ছিক, বার্তা পাঠাতে)</label><input id="s_ph" type="tel">
    <div class="row"><div><label>পরিমাণ</label><input id="s_q" type="number" value="1" min="1"></div><div><label>বিক্রয়মূল্য (প্রতিটি)</label><input id="s_pr" type="number" value="${(products[0] || {}).price || ''}"></div></div>
    <div class="row"><button class="order" onclick="saveSale()">সেভ</button><button class="ghost" onclick="closeM('formM')">বাতিল</button></div>`;
  $('formM').classList.add('open');
}
function saveSale() {
  const p = products.find(x => x.id == $('s_p').value); if (!p) return toast('আগে পণ্য যোগ করুন');
  const qty = Math.max(1, +$('s_q').value || 1);
  priv.sales.push({ id: Date.now(), pid: p.id, title: p.title, qty, price: +$('s_pr').value || 0, cost: p.cost || 0, ph: $('s_ph').value.trim(), date: Date.now() });
  if (p.stock != null) p.stock = Math.max(0, p.stock - qty);
  save(); render(); closeM('formM'); openDash(); toast('বিক্রি যোগ হয়েছে, স্টকও কমেছে');
}
function delSale(id) {
  const x = priv.sales.find(v => v.id === id), p = products.find(v => v.id === x.pid);
  if (confirm('এই বিক্রি মুছবেন? স্টক ফিরে আসবে।')) { if (p && p.stock != null) p.stock += x.qty; priv.sales = priv.sales.filter(v => v.id !== id); save(); render(); openDash(); }
}
function expForm() {
  const t = prompt('খরচের বিবরণ (যেমন বিজ্ঞাপন, ডেলিভারি)'); if (!t) return;
  const a = +prompt('কত টাকা?'); if (!a) return;
  priv.expenses.push({ id: Date.now(), title: t, amt: a, date: Date.now() }); save(); openDash();
}
function delExp(id) { if (confirm('মুছবেন?')) { priv.expenses = priv.expenses.filter(v => v.id !== id); save(); openDash(); } }
function setTarget() { const a = +prompt('এই মাসের বিক্রির লক্ষ্য (টাকা)', priv.target || ''); if (a >= 0) { priv.target = a; save(); openDash(); } }
/* ============ গ্যালারি, ভ্যারিয়েন্ট, ভিডিও ============ */
const gal = p => { const im = [p.image, ...(p.images || [])].filter(Boolean); return im.length ? `<img id="gm" src="${esc(im[0])}" alt="">` + (im.length > 1 && FEATURES.gallery !== false ? `<div class="th">${im.map(u => `<img src="${esc(u)}" onclick="$('gm').src=this.src" alt="">`).join('')}</div>` : '') : ''; };
const L3 = t => (t || '').split('\n').map(l => l.split(':')).filter(a => a.length > 1 && a[0].trim()).map(a => [a[0].trim(), a.slice(1).join(':').split(',').map(x => x.trim()).filter(Boolean)]);
const varsUI = p => L3(p.variants).map(([n, o]) => `<label>${esc(n)}</label><select class="vsel" data-pid="${p.id}" data-n="${esc(n)}"><option value="">বাছুন</option>${o.map(x => `<option>${esc(x)}</option>`).join('')}</select>`).join('');
function curVar(p) { const s = [...document.querySelectorAll('.vsel')].filter(x => x.dataset.pid == p.id); if (!s.length || s.some(x => !x.value)) return null; return s.map(x => x.dataset.n + ': ' + x.value).join(', '); }
const vid = p => { const m = (p.video || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m && FEATURES.video !== false ? `<iframe class="vd" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>` : ''; };
/* ============ কাস্টম ফন্ট, ইনস্টল, QR, আমার অর্ডার ============ */
function applyFont() {
  let t = document.getElementById('cf');
  if (!settings.fontFile) { if (t) t.remove(); return; }
  if (!t) { t = document.createElement('style'); t.id = 'cf'; document.head.appendChild(t); }
  t.textContent = `@font-face{font-family:'CustomFont';src:url("${settings.fontFile}")}`;
  document.body.style.fontFamily = "'CustomFont'," + (document.body.style.fontFamily || "'Hind Siliguri',system-ui,sans-serif");
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let dip; window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; });
function installApp() { if (dip) dip.prompt(); else alert('ব্রাউজারের মেনু (⋮) খুলে "Add to Home screen" বা "হোম স্ক্রিনে যোগ করুন" চাপুন।'); }
function showQR() {
  const u = encodeURIComponent(location.origin + '/');
  $('viewB').innerHTML = `<h3>🔳 সাইটের QR কোড</h3><img src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data=${u}" alt="QR"><p class="sp">ছবিতে চেপে ধরে সেভ করে পোস্টার বা প্যাকেজে ছাপুন।</p><div class="row"><button class="ghost" onclick="closeM('viewM')">বন্ধ</button></div>`;
  $('viewM').classList.add('open');
}
function myOrders() {
  const o = JSON.parse(localStorage.getItem('shop_orders') || '[]').reverse();
  $('viewB').innerHTML = '<h3>📦 আমার অর্ডার</h3>' + (o.map(x => `<div class="ci"><span>${esc(x.items)}<br><small>${new Date(x.id).toLocaleDateString('bn-BD')} · ${CONFIG.currency}${bn(x.total)}</small></span><button class="ghost" onclick="askOrder(${x.id})">অবস্থা জানুন</button></div>`).join('') || '<p class="sp">এই ফোন থেকে এখনো অর্ডার করা হয়নি।</p>') + '<div class="row"><button class="ghost" onclick="closeM(\'viewM\')">বন্ধ</button></div>';
  $('viewM').classList.add('open');
}
function askOrder(id) { const x = JSON.parse(localStorage.getItem('shop_orders') || '[]').find(v => v.id === id); window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('আমার অর্ডারের অবস্থা জানতে চাই: ' + x.items + ' (মোট ' + x.total + ' টাকা)')}`, '_blank'); }
function notifyCust(id) {
  const x = priv.sales.find(v => v.id === id); if (!x || !x.ph) return;
  const k = prompt('কোন বার্তা পাঠাবেন? ১ = অর্ডার নিশ্চিত, ২ = পাঠানো হয়েছে, ৩ = ডেলিভারি সম্পন্ন', '১'); if (!k) return;
  const m = { '১': 'আপনার অর্ডার নিশ্চিত হয়েছে', '২': 'আপনার অর্ডার পাঠানো হয়েছে', '৩': 'আপনার অর্ডার ডেলিভারি সম্পন্ন হয়েছে, ধন্যবাদ' }[k.replace(/[1-3]/, d => '১২৩'[d - 1])] || 'আপনার অর্ডারের হালনাগাদ';
  let n = x.ph.replace(/\D/g, ''); if (n.startsWith('01')) n = '88' + n;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(m + ': ' + x.title + ' ×' + x.qty + ' — ' + CONFIG.shopName)}`, '_blank');
}
/* ============ মডারেটর: প্রস্তাব পাঠানো ও অনুমোদন ============ */
const pstrip = p => { const q = { ...p }; delete q.cost; delete q.sourceLink; delete q.by; return JSON.stringify(q); };
async function sendProposal() {
  const rem = {}; try { (await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json()).products.forEach(p => rem[p.id] = pstrip(p)); } catch (e) {}
  const by = (sessionStorage.getItem('adm') || '').slice(4), ch = products.filter(p => rem[p.id] !== pstrip(p)).map(p => { const q = { ...p, by }; delete q.cost; return q; });
  if (!ch.length) return toast('নতুন বা বদলানো পণ্য নেই');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ by, products: ch })], { type: 'application/json' })); a.download = 'proposal-' + by + '.json'; a.click();
  toast('ফাইলটি অ্যাডমিনকে WhatsApp-এ পাঠান');
}
let pend = [];
function reviewProposals() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.multiple = true;
  i.onchange = async () => { pend = []; for (const f of i.files) { try { const d = JSON.parse(await f.text()); (d.products || []).forEach(p => pend.push({ ...p, by: d.by || '?' })); } catch (e) {} } showProps(); };
  i.click();
}
function showProps() {
  $('formB').innerHTML = `<h3>📥 মডারেটর প্রস্তাব (${bn(pend.length)})</h3>` + (pend.map((p, i) => `<div class="ci"><span>${esc(p.title)} · ${CONFIG.currency}${bn(p.price || 0)}<br><small>মডারেটর: ${esc(p.by)} · ${products.some(x => x.id == p.id) ? 'বদল' : 'নতুন'}</small></span><button class="order alt" style="width:auto;padding:4px 12px" onclick="appr(${i})">✔</button><button class="del" style="padding:4px 12px" onclick="pend.splice(${i},1);showProps()">✖</button></div>`).join('') || '<p class="sp">কিছু নেই।</p>') + '<div class="row"><button class="ghost" onclick="closeM(\'formM\')">বন্ধ</button></div><p class="sp" style="font-size:12px">অনুমোদনের পর 🚀 প্রকাশ চাপুন।</p>';
  $('formM').classList.add('open');
}
function appr(i) {
  const p = pend[i], j = products.findIndex(x => x.id == p.id);
  if (j >= 0) products[j] = { ...products[j], ...p }; else products.push(p);
  pend.splice(i, 1); save(); render(); showProps(); toast('অনুমোদিত');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeM('viewM'); closeM('formM'); } });
load();
</script>
</body>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABUBOKOR CREATIONS</title>
<meta name="description" content="ABUBOKOR CREATIONS — পছন্দের পণ্য এবং গ্রাফিক্স ডিজাইন, ভিডিও এডিটিং ও ডিজিটাল মার্কেটিং সার্ভিস।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1b1f3b;--mut:#6b7090;--line:#e3e5f1;--acc:#4338ca;--hot:#f59e0b;--red:#e11d48}
:root[data-theme=dark]{--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mut:#9aa0c8;--line:#2d315a;--acc:#8b87ff}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-weight:700;font-size:22px;color:var(--acc);flex:1}
.ib{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.2;max-width:14em}
.hero p{color:var(--mut);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools input{flex:1;min-width:180px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:14px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);cursor:pointer}
.ph{display:grid;place-items:center;font-size:42px;color:var(--mut)}
.body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:16px;font-weight:600}
.cat{font-size:12px;color:var(--mut)}
.price{font-weight:700;font-size:18px}
.price s{font-weight:400;font-size:13px;color:var(--mut);margin-left:6px}
.badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px}
.heart{position:absolute;top:8px;right:8px;background:var(--card);border-radius:50%;width:34px;height:34px;font-size:17px}
.order{background:var(--acc);color:#fff;border-radius:10px;padding:9px;margin-top:auto;font-weight:600}
.order.alt{background:#16a34a}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.sheet img{width:100%;border-radius:12px;margin-bottom:10px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.sheet input,.sheet textarea,.sheet select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1}
.ghost{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px}
.del{background:var(--red);color:#fff;border-radius:10px;padding:9px}
.adm{display:none;background:var(--ink);color:var(--bg)}
body.admin .adm{display:block}
.adm .wrap{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
.adm button{background:var(--hot);color:#111;border-radius:8px;padding:6px 12px;font-weight:600}
.ed{position:absolute;bottom:10px;right:10px;display:none;gap:6px}
body.admin .ed{display:flex}
.ed button{background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 9px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;color:var(--mut);padding:24px;border-top:1px solid var(--line)}
.sh{font-size:26px;margin:10px 0 2px}.sp{color:var(--mut)}
#svcSec{border-top:1px solid var(--line);margin-top:10px;padding-top:26px}
.svc{padding:16px;gap:6px;display:flex;flex-direction:column}
.svc .ic{font-size:34px}.svc h3{font-size:18px}.svc p{color:var(--mut);font-size:14px;flex:1}
.soc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.soc a{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 14px;color:var(--ink);text-decoration:none}
.soc a b{display:none;color:var(--red);margin-left:6px;cursor:pointer}
body.admin .soc a b{display:inline}
nav a.ib{text-decoration:none;color:var(--ink)}
.ed{top:48px;right:8px;bottom:auto}
.trust{display:flex;gap:8px;overflow-x:auto;margin:14px 0 0}
.trust span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;white-space:nowrap;font-size:14px}
.stk{font-size:12px;color:var(--red);font-weight:600}.stk.out{color:var(--mut)}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ci span:first-child{flex:1;font-size:14px}.qty{display:flex;align-items:center;gap:8px}
.qty button{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:28px;height:28px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .tot{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.pi{background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
#infoSec{border-top:1px solid var(--line);margin-top:26px;padding:26px 0 30px}
#infoSec details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
#infoSec summary{font-weight:600;cursor:pointer}#infoSec p{color:var(--mut);margin-top:8px;white-space:pre-wrap}
.rv{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.rv a{color:var(--red);cursor:pointer;margin-left:6px}
.rel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rel div{cursor:pointer;font-size:13px;display:flex;flex-direction:column}
.rel img{margin:0 0 4px;border-radius:8px;aspect-ratio:1;object-fit:cover}
.ao{display:none}body.admin .ao{display:inline-block}.sh2{margin:16px 0 4px;font-size:16px}
</style>
</head>
<body>

<div class="adm"><div class="wrap">
  <button onclick="openForm()">+ নতুন পণ্য</button>
  <button onclick="publish()">🚀 সাইটে প্রকাশ করুন</button>
  <button onclick="svcForm()">+ নতুন সার্ভিস</button>
  <button onclick="addSocial()">+ সোশ্যাল লিংক</button>
  <button onclick="exportData()">data.json ডাউনলোড</button>
  <button onclick="document.getElementById('imp').click()">ইমপোর্ট</button>
  <button onclick="logout()">অ্যাডমিন বন্ধ</button>
  <input type="file" id="imp" accept=".json" hidden>
</div></div>

<header><div class="wrap bar">
  <div class="logo" id="logo"></div>
  <a class="ib" id="svcLink" href="#svcSec" style="text-decoration:none;color:inherit">সার্ভিস</a>
  <button class="ib" id="themeBtn" onclick="toggleTheme()">🌙</button>
  <button class="ib" id="favBtn" onclick="toggleFavView()">♡ <span id="favN">0</span></button>
  <button class="ib" id="cartBtn" onclick="openCart()">🛒 <span id="cartN">0</span></button>
</div></header>

<main class="wrap">
  <section class="hero"><h1 id="tagline"></h1><p id="sub"></p></section>
  <div class="trust" id="trust"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="পণ্য খুঁজুন...">
    <select id="sort"><option value="new">নতুন আগে</option><option value="low">দাম কম</option><option value="high">দাম বেশি</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <section id="svcSec"><h2 class="sh">ফ্রিল্যান্সিং সার্ভিস</h2><p class="sp">প্রফেশনাল কাজ, সাশ্রয়ী দামে। জানতে WhatsApp-এ মেসেজ দিন।</p><div class="grid" id="svcGrid"></div></section>
  <section id="infoSec"></section>
</main>
<footer><div class="soc" id="soc"></div><div id="foot"></div></footer>

<div class="modal" id="viewM" onclick="if(event.target===this)closeM('viewM')"><div class="sheet" id="viewB"></div></div>
<div class="modal" id="formM"><div class="sheet" id="formB"></div></div>
<div class="modal" id="cartM" onclick="if(event.target===this)closeM('cartM')"><div class="sheet" id="cartB"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ১. সেটিংস — এখানে বদলালেই সাইট বদলাবে ============ */
const CONFIG = {
  shopName: "ABUBOKOR CREATIONS",
  tagline: "পছন্দের পণ্য ও প্রফেশনাল ডিজিটাল সার্ভিস",
  subtitle: "অর্ডার করতে পণ্যের নিচের বাটনে চাপ দিন।",
  whatsapp: "8801968975869",   // দেশের কোডসহ নম্বর, + ছাড়া
  email: "md.abubokorsiddikakonofficial@gmail.com",
  currency: "৳",
  deliveryInside: 70,        // ঢাকার ভেতরে ডেলিভারি চার্জ
  deliveryOutside: 130,      // ঢাকার বাইরে
  freeDeliveryOver: 0,       // এত টাকার বেশি কিনলে ডেলিভারি ফ্রি (0 = বন্ধ)
  bkash: "01968975869",      // bKash নম্বর (ঠিক আছে কিনা দেখে নিন)
  nagad: "01968975869",      // Nagad নম্বর
  rocket: "01968975869",     // Rocket নম্বর (অ্যাপে শেষে বাড়তি ডিজিট দেখালে সেটা বসান)
  upay: "01968975869",       // Upay নম্বর
  coupons: [{ code: "WELCOME10", percent: 10 }],   // নতুন কুপন এখানে যোগ করুন
  pixelId: "",               // Facebook Pixel ID (থাকলে বসান)
  gaId: "",                  // Google Analytics ID, যেমন G-XXXXXXX
  trust: ["🚚 দ্রুত ডেলিভারি", "💵 ক্যাশ অন ডেলিভারি", "🔁 রিটার্ন সুবিধা", "💬 সাপোর্ট সবসময়"],
  about: "ABUBOKOR CREATIONS একটি অনলাইন শপ ও ডিজিটাল সার্ভিস প্রতিষ্ঠান। আমরা মানসম্মত পণ্য এবং গ্রাফিক্স ডিজাইন, ভিডিও এডিটিং ও ডিজিটাল মার্কেটিং সার্ভিস দিয়ে থাকি।",
  returnPolicy: "পণ্য হাতে পাওয়ার ৩ দিনের মধ্যে ত্রুটিপূর্ণ বা ভুল পণ্য হলে আমাদের জানান। যাচাই করে পণ্য বদলে বা টাকা ফেরত দেওয়া হবে।",
  deliveryInfo: "ঢাকার ভেতরে ১-২ দিন, ঢাকার বাইরে ২-৫ দিনে ডেলিভারি দেওয়া হয়। অর্ডার নিশ্চিত করতে আমরা ফোনে বা WhatsApp-এ যোগাযোগ করব।",
  github: { owner: "abubokorcreations", repo: "abubokorcreations.github.io", branch: "main" },
  salt: "abubokor-shop-2026:",
  adminPassHash: "b2f2fa037ea1b864b45f4f60300f862a3c4b2f5d81094d83e8d597d257860420",   // পাসওয়ার্ড কোডে সরাসরি নেই, শুধু হ্যাশ আছে
  adminHash: "#admin",   // ঠিকানার শেষে এটা লিখলে অ্যাডমিন লগইন আসবে
  /* সোশ্যাল অ্যাকাউন্ট: নতুন লাইন যোগ করলেই বাড়বে (অ্যাডমিন থেকেও যোগ করা যায়) */
  socials: [
    { name: "Facebook", url: "https://www.facebook.com/share/1C6SUUDmSa/" },
    { name: "YouTube", url: "https://youtube.com/@abubokorcreations" },
    { name: "TikTok", url: "https://www.tiktok.com/@abubokorcreations" }
  ]
};
/* ============ ২. ফিচার সুইচ — true/false করে অন/অফ ============ */
const FEATURES = {
  search: true, categories: true, sort: true,
  wishlist: true, darkMode: true,
  services: true, cart: true, coupons: true, stock: true, trust: true, info: true, reviews: true, related: true, flashSale: true, discountBadge: true, whatsappOrder: true, share: true
};

/* ============ ৩. ডেটা ============ */
const KEY = 'shop_data_v2';
const DEFAULT_SERVICES = [
  { id: 1, icon: '🎨', title: 'গ্রাফিক্স ডিজাইন', desc: 'লোগো, ব্যানার, পোস্টার, সোশ্যাল মিডিয়া ডিজাইন।', price: 300 },
  { id: 2, icon: '🎬', title: 'ভিডিও এডিটিং', desc: 'ইউটিউব, রিলস ও টিকটক ভিডিও এডিটিং।', price: 500 },
  { id: 3, icon: '📈', title: 'ডিজিটাল মার্কেটিং', desc: 'ফেসবুক পেজ, বিজ্ঞাপন ও অনলাইন প্রচার।', price: 1000 }
];
let services = [], socials = [];
let cart = JSON.parse(localStorage.getItem('shop_cart') || '{}'), coupon = null;
let products = [], cat = 'সব', favOnly = false;
let favs = JSON.parse(localStorage.getItem('shop_favs') || '[]');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ products, services, socials })); } catch (e) { toast('ছবি বেশি বড়, ছোট ছবি দিন'); } };

async function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!d) { try { d = await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) {} }
  d = d || {};
  products = d.products || []; services = d.services || DEFAULT_SERVICES; socials = d.socials || CONFIG.socials;
  init();
}

function init() {
  $('logo').textContent = CONFIG.shopName; document.title = CONFIG.shopName;
  $('tagline').textContent = CONFIG.tagline; $('sub').textContent = CONFIG.subtitle;
  $('foot').innerHTML = '© ' + esc(CONFIG.shopName) + (CONFIG.email ? ' · <a href="mailto:' + esc(CONFIG.email) + '" style="color:inherit">' + esc(CONFIG.email) + '</a>' : '');
  if (!FEATURES.services) { $('svcSec').style.display = 'none'; $('svcLink').style.display = 'none'; }
  if (!FEATURES.search) $('q').style.display = 'none';
  if (!FEATURES.sort) $('sort').style.display = 'none';
  if (!FEATURES.wishlist) $('favBtn').style.display = 'none';
  if (!FEATURES.darkMode) $('themeBtn').style.display = 'none';
  if (localStorage.getItem('shop_theme') === 'dark') setTheme('dark');
  if (sessionStorage.getItem('adm') === '1') document.body.classList.add('admin');
  initExtras();
  $('q').oninput = render; $('sort').onchange = render;
  $('imp').onchange = importData;
  if (location.hash === CONFIG.adminHash && !document.body.classList.contains('admin')) login();
  render();
}

/* ============ ৪. দেখানো ============ */
function render() {
  const cats = ['সব', ...new Set(products.map(p => p.category).filter(Boolean))];
  $('chips').innerHTML = FEATURES.categories && cats.length > 1
    ? cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('') : '';
  const q = $('q').value.trim().toLowerCase();
  let list = products.map(live).filter(p =>
    (cat === 'সব' || p.category === cat) &&
    (!favOnly || favs.includes(p.id)) &&
    (!q || (p.title + ' ' + (p.desc || '')).toLowerCase().includes(q)));
  const s = $('sort').value;
  if (s === 'low') list.sort((a, b) => (a.price || 0) - (b.price || 0));
  else if (s === 'high') list.sort((a, b) => (b.price || 0) - (a.price || 0));
  else list.sort((a, b) => b.id - a.id);
  $('favN').textContent = bn(favs.length);
  renderExtra();
  $('cartN').textContent = bn(cartCount());
  $('grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>';
}

function card(p) {
  const off = FEATURES.discountBadge && p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  return `<article class="card">
    ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onclick="view(${p.id})">` : `<div class="ph" onclick="view(${p.id})">🛍️</div>`}
    ${off ? `<span class="badge">${bn(off)}% ছাড়</span>` : ''}
    ${FEATURES.wishlist ? `<button class="heart" onclick="fav(${p.id})" aria-label="পছন্দের তালিকা">${favs.includes(p.id) ? '❤️' : '🤍'}</button>` : ''}
    <div class="body">
      ${p.category ? `<span class="cat">${esc(p.category)}</span>` : ''}
      <h3>${esc(p.title)}</h3>${stars(p)}
      ${p.price ? `<div class="price">${CONFIG.currency}${bn(p.price)}${off ? `<s>${bn(p.oldPrice)}</s>` : ''}</div>` : ''}
      ${cdown(p)}${buyBtn(p)}
    </div>
    <div class="ed"><button onclick="openForm(${p.id})">এডিট</button></div>
  </article>`;
}

function view(id) {
  const p = getP(id); if (!p) return;
  const rel = FEATURES.related ? products.filter(x => x.id !== id && (!p.category || x.category === p.category)).slice(0, 4).map(live) : [];
  const rv = (p.reviews || []).map((r, i) => `<div class="rv"><b>${esc(r.name)}</b> ${'⭐'.repeat(r.rating)}<a class="ao" onclick="delReview(${id},${i})">×</a><br>${esc(r.text)}</div>`).join('');
  $('viewB').innerHTML = `${p.image ? `<img src="${esc(p.image)}" alt="">` : ''}
    <h2>${esc(p.title)}</h2>${stars(p)}
    ${p.price ? `<div class="price">${CONFIG.currency}${bn(p.price)}${p.oldPrice > p.price ? `<s>${bn(p.oldPrice)}</s>` : ''}</div>` : ''}${cdown(p)}

function shrink(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 700 / im.width), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8));
    }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

const saleOn = p => FEATURES.flashSale && p.saleEnd && Date.parse(p.saleEnd) > Date.now() && p.oldPrice > p.price;
const avg = p => p.reviews && p.reviews.length ? p.reviews.reduce((t, r) => t + r.rating, 0) / p.reviews.length : 0;
const stars = p => FEATURES.reviews && avg(p) ? `<span class="cat">⭐ ${bn(avg(p).toFixed(1))} (${bn(p.reviews.length)})</span>` : '';
const cdown = p => saleOn(p) ? `<div class="stk" data-end="${esc(p.saleEnd)}">⏱</div>` : '';
setInterval(() => document.querySelectorAll('[data-end]').forEach(e => {
  const d = Date.parse(e.dataset.end) - Date.now();
  if (d <= 0) { e.removeAttribute('data-end'); render(); return; }
  e.textContent = '⏱ অফার শেষ: ' + bn(Math.floor(d / 36e5)) + ' ঘ ' + bn(Math.floor(d % 36e5 / 6e4)) + ' মি ' + bn(Math.floor(d % 6e4 / 1e3)) + ' সে';
}), 1000);
function addReview(id) {
  const p = products.find(x => x.id === id), name = prompt('কাস্টমারের নাম'); if (!name) return;
  const rating = Math.min(5, Math.max(1, Math.round(+prompt('রেটিং (১ থেকে ৫, ইংরেজি সংখ্যায়)', '5') || 5)));
  (p.reviews = p.reviews || []).push({ name, rating, text: prompt('কাস্টমারের মতামত') || '' }); save(); render(); view(id);
}
function delReview(id, i) { if (confirm('রিভিউ মুছবেন?')) { products.find(x => x.id === id).reviews.splice(i, 1); save(); render(); view(id); } }
/* ============ এক ক্লিকে প্রকাশ (GitHub) ============ */
const GH = CONFIG.github;
const ghApi = path => `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
const b64 = t => btoa(unescape(encodeURIComponent(t)));
async function ghPut(path, content, msg, tok) {
  const h = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' };
  for (let i = 0; i < 5; i++) {
    let sha; const r = await fetch(ghApi(path) + '?ref=' + GH.branch + '&t=' + Date.now(), { headers: h, cache: 'no-store' });
    if (r.ok) sha = (await r.json()).sha; else if (r.status === 401) throw new Error('টোকেন ভুল');
    const w = await fetch(ghApi(path), { method: 'PUT', headers: h, body: JSON.stringify({ message: msg, content, branch: GH.branch, sha }) });
    if (w.ok) return;
    if (w.status === 409 || w.status === 422) { await new Promise(ok => setTimeout(ok, 1500 * (i + 1))); continue; }
    if (w.status === 401 || w.status === 403 || w.status === 404) throw new Error('টোকেন ভুল বা অনুমতি নেই');
    throw new Error('GitHub ' + w.status);
  }
  throw new Error('GitHub এখন ব্যস্ত, একটু পরে আবার চাপুন');
}
async function publish() {
  let tok = localStorage.getItem('gh_token');
  if (!tok) { tok = (prompt('GitHub টোকেন দিন (শুধু এই ফোনে সেভ থাকবে)') || '').trim(); if (!tok) return; }
  toast('প্রকাশ হচ্ছে... একটু অপেক্ষা করুন');
  try {
    const done = JSON.parse(localStorage.getItem('gh_imgs') || '{}');
    const pub = JSON.parse(JSON.stringify({ products, services, socials }));
    for (const p of pub.products) if (p.image && p.image.startsWith('data:')) {
      const path = 'img/' + p.id + '.jpg';
      if (done[p.id] !== p.image.length) { await ghPut(path, p.image.split(',')[1], 'Add image', tok); done[p.id] = p.image.length; }
      p.image = path;
    }
    await ghPut('data.json', b64(JSON.stringify(pub, null, 1)), 'Update products', tok);
    localStorage.setItem('gh_token', tok); localStorage.setItem('gh_imgs', JSON.stringify(done));
    toast('প্রকাশ হয়েছে! ১-২ মিনিটে সবার ফোনে দেখাবে');
  } catch (e) {
    toast('সমস্যা: ' + e.message);
    if (e.message.includes('টোকেন')) localStorage.removeItem('gh_token');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeM('viewM'); closeM('formM'); } });
load();
